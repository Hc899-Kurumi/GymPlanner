<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymPlanner" />
  <title>GymPlanner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="todayLabel">TODAY</p>
        <h1>GymPlanner</h1>
      </div>
      <button class="icon-button" id="themeButton" aria-label="Toggle color theme">◐</button>
    </header>

    <main id="app" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="today"><span>⌂</span>Today</button>
      <button class="nav-item" data-view="routines"><span>▦</span>Routines</button>
      <button class="nav-item" data-view="history"><span>◷</span>History</button>
      <button class="nav-item" data-view="progress"><span>↗</span>Progress</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js" defer></script>
</body>
</html>
