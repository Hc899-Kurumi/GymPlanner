<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="GymPlanner" />
  <title>GymPlanner</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <section class="auth-screen" id="authScreen">
    <div class="auth-card">
      <div class="auth-logo" aria-hidden="true">GP</div>
      <p class="eyebrow">YOUR TRAINING, YOUR DATA</p>
      <h1>Welcome to GymPlanner</h1>
      <p class="auth-intro">Sign in to open your routines and workout history.</p>

      <div class="auth-tabs" role="tablist" aria-label="Account action">
        <button class="auth-tab active" id="loginTab" type="button" role="tab" aria-selected="true">Log in</button>
        <button class="auth-tab" id="signupTab" type="button" role="tab" aria-selected="false">Sign up</button>
      </div>

      <form id="authForm">
        <label class="field">Email address
          <input id="authEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required />
        </label>
        <label class="field auth-password-field">Password
          <input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="At least 6 characters" required />
        </label>
        <label class="field" id="confirmPasswordField" hidden>Confirm password
          <input id="authConfirmPassword" type="password" autocomplete="new-password" minlength="6" placeholder="Enter password again" />
        </label>
        <p class="auth-message" id="authMessage" role="alert"></p>
        <button class="primary wide" id="authSubmit" type="submit">Log in</button>
        <button class="text-button auth-reset" id="resetPassword" type="button">Forgot password?</button>
      </form>

      <div class="auth-setup" id="authSetup" hidden>
        <strong>Firebase setup required</strong>
        <span>Add your Firebase web configuration to <code>firebase-config.js</code> before accounts can be used.</span>
      </div>
    </div>
  </section>

  <div class="app-shell" id="appShell" hidden>
    <header class="topbar">
      <div>
        <p class="eyebrow" id="todayLabel">TODAY</p>
        <h1>GymPlanner</h1>
      </div>
      <div class="topbar-actions">
        <span class="user-email" id="userEmail"></span>
        <button class="icon-button" id="themeButton" aria-label="Toggle color theme">◐</button>
        <button class="logout-button" id="logoutButton" type="button">Log out</button>
      </div>
    </header>

    <main id="app" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="today"><span>⌂</span>Today</button>
      <button class="nav-item" data-view="routines"><span>▦</span>Routines</button>
      <button class="nav-item" data-view="history"><span>◷</span>History</button>
      <button class="nav-item" data-view="progress"><span>↗</span>Progress</button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js" defer></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
